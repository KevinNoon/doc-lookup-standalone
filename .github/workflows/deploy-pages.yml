name: Deploy web build to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
      - run: flutter pub get
      # GitHub Pages serves project sites under /<repo-name>/, not the
      # domain root, so every asset URL needs that prefix baked in at
      # build time. web/flutter_bootstrap.js and web/custom_sw.js only use
      # relative paths, so they don't need any change for this.
      - run: flutter build web --release --base-href /doc-lookup-standalone/
      # Stamps the service worker's cache name with this commit's SHA so
      # every deploy gets a distinct cache automatically — see the comment
      # on CACHE_NAME in web/custom_sw.js for why this can't be a
      # hand-bumped version number.
      - run: sed -i "s/__BUILD_ID__/${{ github.sha }}/" build/web/custom_sw.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
